<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Masjid Finder</title>\n    <style>\n        body { font-family: Arial, sans-serif; }\n        #map { height: 400px; width: 100%; }\n        table { width: 100%; border-collapse: collapse; margin-top: 20px; }\n        table, th, td { border: 1px solid black; }\n        th, td { padding: 8px; text-align: left; }\n    </style>\n    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY"></script>\n</head>\n<body>\n    <h1>Masjid Finder</h1>\n    <input type="text" id="search" placeholder="Search masjids..." onkeyup="searchMasjids()">\n    <div id="map"></div>\n    <table id="masjidTable">\n        <thead>\n            <tr>\n                <th>Name</th>\n                <th>Address</th>\n                <th>Coordinates</th>\n            </tr>\n        </thead>\n        <tbody>\n            <!-- Masjid data will be populated here -->\n        </tbody>\n    </table>\n    <script>\n        const masjidData = [\n            { name: 'Masjid A', address: 'Address A', coords: { lat: -34.397, lng: 150.644 } },\n            { name: 'Masjid B', address: 'Address B', coords: { lat: -35.307, lng: 149.124 } }\n            // Add more masjid data as needed\n        ];\n\n        function initMap() {\n            const center = { lat: -34.397, lng: 150.644 };\n            const map = new google.maps.Map(document.getElementById('map'), {\n                zoom: 8,\n                center: center\n            });\n\n            masjidData.forEach(masjid => {\n                const marker = new google.maps.Marker({\n                    position: masjid.coords,\n                    map: map,\n                    title: masjid.name\n                });\n            });\n        }\n\n        function searchMasjids() {\n            const input = document.getElementById('search').value.toLowerCase();\n            const table = document.getElementById('masjidTable').getElementsByTagName('tbody')[0];\n            table.innerHTML = '';\n            masjidData.forEach(masjid => {\n                if (masjid.name.toLowerCase().includes(input) || masjid.address.toLowerCase().includes(input)) {\n                    const row = table.insertRow();\n                    row.insertCell(0).innerText = masjid.name;\n                    row.insertCell(1).innerText = masjid.address;\n                    row.insertCell(2).innerText = `${masjid.coords.lat}, ${masjid.coords.lng}`;\n                }\n            });\n        }\n\n        window.onload = initMap;\n    </script>\n</body>\n</html>
