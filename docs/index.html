<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masjid Finder</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background: linear-gradient(to right, #4facfe, #00f2fe);
        }
        table {
            transition: transform 0.2s;
        }
        table:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body class="font-sans">
    <div class="container mx-auto p-5">
        <h1 class="text-4xl text-center mb-6 text-white">Masjid Finder</h1>
        <input type="text" id="search" placeholder="Search masjid..." class="mb-4 p-2 w-full rounded border border-gray-300">
        <table class="min-w-full bg-white border border-gray-300 rounded-lg shadow-md">
            <thead>
                <tr class="bg-gray-200">
                    <th class="py-3 px-4 font-bold text-gray-600">Masjid Name</th>
                    <th class="py-3 px-4 font-bold text-gray-600">Location</th>
                    <th class="py-3 px-4 font-bold text-gray-600">Contact</th>
                </tr>
            </thead>
            <tbody id="masjidTable">
                <tr>
                    <td class="border py-2 px-4">Al Noor Mosque</td>
                    <td class="border py-2 px-4">123 Main St, Springfield</td>
                    <td class="border py-2 px-4">(555) 123-4567</td>
                </tr>
                <tr>
                    <td class="border py-2 px-4">Al-Farooq Community Center</td>
                    <td class="border py-2 px-4">456 Elm St, Springfield</td>
                    <td class="border py-2 px-4">(555) 765-4321</td>
                </tr>
                <tr>
                    <td class="border py-2 px-4">Masjid Al-Islam</td>
                    <td class="border py-2 px-4">789 Pine St, Springfield</td>
                    <td class="border py-2 px-4">(555) 987-6543</td>
                </tr>
            </tbody>
        </table>
    </div>
    <script>
        const searchInput = document.getElementById('search');
        const masjidTable = document.getElementById('masjidTable');

        searchInput.addEventListener('input', function() {
            const filter = searchInput.value.toLowerCase();
            const rows = masjidTable.getElementsByTagName('tr');

            for (let i = 0; i < rows.length; i++) {
                const cells = rows[i].getElementsByTagName('td');
                let match = false;

                for (let j = 0; j < cells.length; j++) {
                    if (cells[j].innerText.toLowerCase().includes(filter)) {
                        match = true;
                        break;
                    }
                }
                rows[i].style.display = match ? '' : 'none';
            }
        });
    </script>
</body>
</html>
