<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masjid Finder</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
    <div class="container mx-auto p-4">
        <h1 class="text-3xl font-bold mb-4">Masjid Finder</h1>
        <input type="text" id="search" class="mb-4 p-2 border rounded" placeholder="Search masjids..." />
        <table class="min-w-full border-collapse border border-gray-200">
            <thead>
                <tr class="bg-gray-100">
                    <th class="border border-gray-200 p-2">ID</th>
                    <th class="border border-gray-200 p-2">Name</th>
                    <th class="border border-gray-200 p-2">Type</th>
                    <th class="border border-gray-200 p-2">State</th>
                    <th class="border border-gray-200 p-2">City</th>
                    <th class="border border-gray-200 p-2">Address</th>
                    <th class="border border-gray-200 p-2">Latitude</th>
                    <th class="border border-gray-200 p-2">Longitude</th>
                    <th class="border border-gray-200 p-2">Phone</th>
                </tr>
            </thead>
            <tbody id="masjid-table">
                <tr>
                    <td colspan="9" class="text-center p-2">Loading...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        async function fetchMasjidData() {
            try {
                // Dynamically construct path based on current GitHub Pages URL
                const basePath = window.location.pathname.split('/').slice(0, -1).join('/');
                const csvPath = `${basePath}/data/masjids.csv`;

                const response = await fetch(csvPath);
                if (!response.ok) throw new Error('Network response was not ok');

                const csvText = await response.text();

                // Parse CSV using PapaParse (handles quoted commas)
                const parsedData = Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true
                }).data;

                displayData(parsedData);
            } catch (error) {
                document.getElementById('masjid-table').innerHTML =
                    `<tr><td colspan='9' class='text-red-500 text-center'>Error loading data: ${error.message}</td></tr>`;
            }
        }

        function displayData(masjids) {
            const tableBody = document.getElementById('masjid-table');
            tableBody.innerHTML = '';

            masjids.forEach(masjid => {
                const row = `<tr class='border border-gray-200'>
                    <td class='border border-gray-200 p-2'>${masjid.id}</td>
                    <td class='border border-gray-200 p-2'>${masjid.name}</td>
                    <td class='border border-gray-200 p-2'>${masjid.type}</td>
                    <td class='border border-gray-200 p-2'>${masjid.state}</td>
                    <td class='border border-gray-200 p-2'>${masjid.city}</td>
                    <td class='border border-gray-200 p-2'>${masjid.address}</td>
                    <td class='border border-gray-200 p-2'>${masjid.latitude}</td>
                    <td class='border border-gray-200 p-2'>${masjid.longitude}</td>
                    <td class='border border-gray-200 p-2'>${masjid.phone}</td>
                </tr>`;
                tableBody.innerHTML += row;
            });

            setupSearch(masjids);
        }

        function setupSearch(masjids) {
            const searchBox = document.getElementById('search');
            searchBox.addEventListener('input', () => {
                const filter = searchBox.value.toLowerCase();
                const filteredMasjids = masjids.filter(masjid => {
                    return masjid.name.toLowerCase().includes(filter) ||
                           masjid.city.toLowerCase().includes(filter) ||
                           masjid.state.toLowerCase().includes(filter) ||
                           masjid.address.toLowerCase().includes(filter) ||
                           masjid.type.toLowerCase().includes(filter);
                });
                displayData(filteredMasjids);
            });
        }

        window.onload = fetchMasjidData;
    </script>
</body>
</html>
