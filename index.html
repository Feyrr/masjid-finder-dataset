<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masjid Finder</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    /* Sticky header */
    thead th {
      position: sticky;
      top: 0;
      background-color: #ffe4ec; /* pink-100 */
      z-index: 10;
    }

    /* Table container style */
    .table-wrapper {
      width: 100%;
      margin: 0 auto;
      padding-right: 1rem; /* Adds right padding */
    }

    .table-view {
      width: 100%; /* Ensure the table takes full width of the container */
      border-collapse: collapse;
    }

    .pagination {
      display: flex;
      justify-content: center;
      margin-top: 1rem;
    }

    .pagination button {
      background-color: #ffe4ec;
      padding: 5px 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      cursor: pointer;
      margin: 0 5px;
    }

    .pagination button:hover {
      background-color: #ffb6c1;
    }

    .pagination button.disabled {
      background-color: #f0f0f0;
      cursor: not-allowed;
    }

    /* Hide table on small screens, show card */
    @media (max-width: 768px) {
      .table-view {
        display: none;
      }
      .card-view {
        display: block;
      }
    }

    @media (min-width: 769px) {
      .table-view {
        display: table;
      }
      .card-view {
        display: none;
      }
    }
  </style>
</head>
<body class="bg-gray-50">

<div class="container mx-auto p-4">
  <h1 class="text-4xl font-bold mb-6 text-center text-gray-800">Masjid Finder</h1>

  <!-- Search bar -->
  <div class="sticky top-0 bg-gray-50 z-20 p-2 border-b border-gray-200 mb-4">
    <input type="text" id="search" 
      class="w-full max-w-lg p-3 border rounded shadow-sm focus:outline-none focus:ring-2 focus:ring-pink-500"
      placeholder="Search by Name, City, State, Type, Address, etc..." />
  </div>

  <!-- Table view (desktop) -->
  <div class="table-wrapper overflow-x-auto shadow rounded-lg table-view">
    <table class="min-w-full border-collapse">
      <thead>
        <tr>
          <th class="border px-3 py-2">ID</th>
          <th class="border px-3 py-2">Name</th>
          <th class="border px-3 py-2">Type</th>
          <th class="border px-3 py-2">State</th>
          <th class="border px-3 py-2">City</th>
          <th class="border px-3 py-2">Address</th>
          <th class="border px-3 py-2">Latitude</th>
          <th class="border px-3 py-2">Longitude</th>
          <th class="border px-3 py-2">Phone</th>
          <th class="border px-3 py-2">Email</th>
          <th class="border px-3 py-2">Website</th>
          <th class="border px-3 py-2">Facilities</th>
          <th class="border px-3 py-2">Capacity</th>
          <th class="border px-3 py-2">Established Year</th>
          <th class="border px-3 py-2">Notes</th>
        </tr>
      </thead>
      <tbody id="masjid-table" class="bg-white">
        <tr>
          <td colspan="15" class="text-center p-4 text-gray-500">Loading data...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination Controls -->
  <div id="pagination" class="pagination">
    <!-- Pagination buttons will be dynamically added here -->
  </div>

  <!-- Card view (mobile) -->
  <div id="masjid-cards" class="card-view space-y-4"></div>

</div>

<script>
let masjidData = [];
let currentPage = 1;
let rowsPerPage = 50;

async function fetchMasjidData() {
  try {
    const basePath = window.location.pathname.split('/').slice(0, -1).join('/');
    const csvPath = `${basePath}/data/masjids.csv`;

    const response = await fetch(csvPath);
    if (!response.ok) throw new Error('Network response was not ok');

    const csvText = await response.text();

    masjidData = Papa.parse(csvText, {
      header: true,
      skipEmptyLines: true
    }).data;

    displayData(masjidData);
    setupPagination(masjidData);
  } catch (error) {
    document.getElementById('masjid-table').innerHTML =
      `<tr><td colspan='15' class='text-center text-red-500 p-4'>Error loading data: ${error.message}</td></tr>`;
  }
}

function displayData(data) {
  const tableBody = document.getElementById('masjid-table');
  const cardsContainer = document.getElementById('masjid-cards');
  tableBody.innerHTML = '';
  cardsContainer.innerHTML = '';

  // Apply pagination
  const start = (currentPage - 1) * rowsPerPage;
  const end = currentPage * rowsPerPage;
  const paginatedData = data.slice(start, end);

  if (!paginatedData.length) {
    tableBody.innerHTML = `<tr><td colspan='15' class='text-center p-4 text-gray-500'>No results found</td></tr>`;
    cardsContainer.innerHTML = `<div class="text-center text-gray-500 p-4">No results found</div>`;
    return;
  }

  paginatedData.forEach(masjid => {
    // Table row
    const row = `<tr class="border-b hover:bg-gray-50">
      <td class="border px-2 py-1">${masjid.id}</td>
      <td class="border px-2 py-1">${masjid.name}</td>
      <td class="border px-2 py-1">${masjid.type}</td>
      <td class="border px-2 py-1">${masjid.state}</td>
      <td class="border px-2 py-1">${masjid.city}</td>
      <td class="border px-2 py-1">${masjid.address}</td>
      <td class="border px-2 py-1">${masjid.latitude}</td>
      <td class="border px-2 py-1">${masjid.longitude}</td>
      <td class="border px-2 py-1">${masjid.phone}</td>
      <td class="border px-2 py-1">${masjid.email}</td>
      <td class="border px-2 py-1">${masjid.website}</td>
      <td class="border px-2 py-1">${masjid.facilities}</td>
      <td class="border px-2 py-1">${masjid.capacity}</td>
      <td class="border px-2 py-1">${masjid.established_year}</td>
      <td class="border px-2 py-1">${masjid.notes}</td>
    </tr>`;
    tableBody.innerHTML += row;

    // Mobile card
    const card = `<div class="bg-white shadow rounded p-4">
      <h2 class="font-bold text-lg mb-1">${masjid.name}</h2>
      <p><span class="font-semibold">Type:</span> ${masjid.type}</p>
      <p><span class="font-semibold">State:</span> ${masjid.state}</p>
      <p><span class="font-semibold">City:</span> ${masjid.city}</p>
      <p><span class="font-semibold">Address:</span> ${masjid.address}</p>
      <p><span class="font-semibold">Phone:</span> ${masjid.phone}</p>
      <p><span class="font-semibold">Email:</span> ${masjid.email}</p>
      <p><span class="font-semibold">Website:</span> ${masjid.website}</p>
      <p><span class="font-semibold">Facilities:</span> ${masjid.facilities}</p>
      <p><span class="font-semibold">Capacity:</span> ${masjid.capacity}</p>
      <p><span class="font-semibold">Established:</span> ${masjid.established_year}</p>
      <p><span class="font-semibold">Notes:</span> ${masjid.notes}</p>
    </div>`;
    cardsContainer.innerHTML += card;
  });
}

function setupPagination(data) {
  const totalPages = Math.ceil(data.length / rowsPerPage);
  const paginationContainer = document.getElementById('pagination');
  paginationContainer.innerHTML = '';

  const prevButton = `<button class="disabled ${currentPage === 1 ? 'disabled' : ''}" onclick="changePage(${currentPage - 1})">Prev</button>`;
  paginationContainer.innerHTML += prevButton;

  for (let i = 1; i <= totalPages; i++) {
    const pageButton = `<button class="${currentPage === i ? 'bg-pink-500 text-white' : ''}" onclick="changePage(${i})">${i}</button>`;
    paginationContainer.innerHTML += pageButton;
  }

  const nextButton = `<button class="disabled ${currentPage === totalPages ? 'disabled' : ''}" onclick="changePage(${currentPage + 1})">Next</button>`;
  paginationContainer.innerHTML += nextButton;
}

function changePage(page) {
  currentPage = page;
  displayData(masjidData);
  setupPagination(masjidData);
}

function setupSearch() {
  const searchBox = document.getElementById('search');
  searchBox.addEventListener('input', () => {
    const filter = searchBox.value.toLowerCase().trim();
    const filtered = masjidData.filter(m => 
      Object.values(m).some(v => v && v.toString().toLowerCase().includes(filter))
    );
    displayData(filtered);
    setupPagination(filtered);
  });
}

window.onload = () => {
  fetchMasjidData().then(setupSearch);
};
</script>

</body>
</html>
